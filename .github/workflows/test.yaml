name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Pre-generate static assets
        run: python scripts/build_static.py

      - name: Python tests
        run: |
          PYTHONPATH=src python src/test.py
          PYTHONPATH=src python src/test_fallbacks.py
          PYTHONPATH=src python src/test_route_schema.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: View tests
        run: node dev/viewer.test.js

      - name: Docker build (startup self-check + static pregen)
        run: docker build .
