services:
  daniel-library-mcp:
    image: ghcr.io/shanghai-rits/daniel-library-mcp:latest
    build: .
    container_name: daniel-library-mcp
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    environment:
      - PORT=${PORT:-8000}
      - ENABLE_MCP_APPS=${ENABLE_MCP_APPS:-1}
    restart: unless-stopped
